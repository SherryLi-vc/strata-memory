[project]
name = "strata-memory-mcp"
version = "2.1.0"
description = "Industrial AI memory base for Agents via MCP: SQLite SoT, rebuildable vectors, progressive recall, defensive tool contracts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vincy", email = "vincy@strata-memory.dev" }]
keywords = ["mcp", "memory", "agent", "vector", "chromadb", "bge-m3", "sqlite", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
enterprise = [
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
]

[project.scripts]
strata-memory-mcp = "strata_memory.__main__:main"
strata-memory-migrate = "strata_memory.ops.migrate_v02:main"

[project.urls]
Homepage = "https://github.com/vincy/strata-memory"
Issues = "https://github.com/vincy/strata-memory/issues"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["strata_memory*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
