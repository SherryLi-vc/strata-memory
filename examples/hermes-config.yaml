# Strata Memory MCP — Hermes Integration

Add to `~/.hermes/config.yaml` under `mcp_servers:`:

```yaml
mcp_servers:
  strata-memory:
    command: uv
    args:
      - run
      - strata-memory-mcp
    timeout: 120
```

Or if installed via PyPI:

```yaml
mcp_servers:
  strata-memory:
    command: strata-memory-mcp
    timeout: 120
```

After adding, restart Hermes:

```bash
hermes gateway restart
```
