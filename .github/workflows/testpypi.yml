name: Publish to TestPyPI

# Manual only. Does not run on push or release, and does not publish to PyPI.
# Configure a TestPyPI trusted publisher for this repo (no API token in the repo).
# https://docs.pypi.org/trusted-publishers/

on:
  workflow_dispatch:

jobs:
  publish-testpypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
